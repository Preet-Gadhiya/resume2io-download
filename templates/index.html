<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <title>resume2io-download</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: "Inter", sans-serif;
            margin: 0;
            background: #f7f8fa;
            color: #1c1c1c;
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            padding: 2rem;
        }

        .card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 2rem 2.5rem;
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        h1 { font-size: 1.6rem; margin: 0; }
        h2 { font-size: 1rem; margin: 0; font-weight: 500; color: #555; }

        .field {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        label { font-size: 0.8rem; font-weight: 500; color: #444; }

        input[type=text] {
            width: 100%;
            padding: 0.65rem 0.85rem;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            font-family: "Inter", sans-serif;
            font-size: 0.95rem;
        }

        input[type=text]:focus {
            outline: none;
            border-color: #4a90d9;
            box-shadow: 0 0 0 3px rgba(74,144,217,0.15);
        }

        .hint {
            font-size: 0.72rem;
            color: #888;
            line-height: 1.4;
        }

        .hint code {
            background: #f1f3f5;
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 0.72rem;
        }

        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            border-radius: 6px;
            border: none;
            font-size: 0.95rem;
            font-family: "Inter", sans-serif;
            background-color: #1c1c1c;
            color: #fff;
            cursor: pointer;
            padding: 0.75rem 1.5rem;
            width: 100%;
            transition: opacity 0.15s;
        }

        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn:hover:not(:disabled) { opacity: 0.85; }

        .error {
            display: none;
            color: #dc2626;
            font-size: 0.78rem;
        }

        .spinner {
            transform-origin: center;
            animation: spin 2s linear infinite;
        }
        .spinner circle {
            stroke-linecap: round;
            animation: dash 1.5s ease-in-out infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes dash {
            0%   { stroke-dasharray: 0 150; stroke-dashoffset: 0; }
            47.5%{ stroke-dasharray: 42 150; stroke-dashoffset: -16; }
            95%, 100% { stroke-dasharray: 42 150; stroke-dashoffset: -59; }
        }

        .divider {
            text-align: center;
            font-size: 0.75rem;
            color: #aaa;
            position: relative;
        }
        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 38%;
            border-top: 1px solid #e5e7eb;
        }
        .divider::before { left: 0; }
        .divider::after  { right: 0; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>resume2io-download</h1>
        <h2>Download your resume.io resume as PDF</h2>

        <div class="field">
            <label for="resume_id">Resume ID</label>
            <input type="text" id="resume_id" placeholder="e.g. 69570346" inputmode="numeric">
            <span class="hint">
                Found in the URL when editing your resume:<br>
                <code>resume.io/app/resumes/<strong>69570346</strong>/edit</code>
            </span>
        </div>

        <div class="field">
            <label for="session_id">Session Cookie (<code>_session_id</code>)</label>
            <input type="text" id="session_id" placeholder="Paste your _session_id value">
            <span class="hint">
                Open DevTools on resume.io → Application tab → Cookies →
                <code>https://resume.io</code> → copy the value of <code>_session_id</code>
            </span>
        </div>

        <span class="error" id="form-error">Resume ID and session cookie are both required.</span>

        <button class="btn" id="download-btn" type="button">
            <span id="btn-text">Download PDF</span>
            <svg id="btn-spinner" style="display:none" width="20" height="20" stroke="#fff" viewBox="0 0 24 24">
                <g class="spinner"><circle cx="12" cy="12" r="9.5" fill="none" stroke-width="3"></circle></g>
            </svg>
        </button>
    </div>
</div>

<script>
    document.getElementById('download-btn').addEventListener('click', async function () {
        const resumeId  = document.getElementById('resume_id').value.trim();
        const sessionId = document.getElementById('session_id').value.trim();
        const errEl     = document.getElementById('form-error');

        if (!resumeId || !sessionId) {
            errEl.style.display = 'block';
            return;
        }
        errEl.style.display = 'none';

        const btn     = document.getElementById('download-btn');
        const btnText = document.getElementById('btn-text');
        const spinner = document.getElementById('btn-spinner');

        btn.disabled        = true;
        btnText.style.display = 'none';
        spinner.style.display = 'block';

        try {
            const resp = await fetch('/download/' + resumeId, {
                method: 'POST',
                headers: { 'X-Session-Id': sessionId }
            });

            if (!resp.ok) {
                const err = await resp.json().catch(() => ({ detail: 'Unknown error' }));
                errEl.textContent = 'Error: ' + (err.detail || resp.status);
                errEl.style.display = 'block';
                return;
            }

            const blob = await resp.blob();
            const url  = URL.createObjectURL(blob);
            const a    = document.createElement('a');
            a.href     = url;
            a.download = resumeId + '.pdf';
            a.click();
            URL.revokeObjectURL(url);
        } catch (err) {
            errEl.textContent = 'Request failed: ' + err.message;
            errEl.style.display = 'block';
        } finally {
            btn.disabled        = false;
            btnText.style.display = 'block';
            spinner.style.display = 'none';
        }
    });
</script>
</body>
</html>
