[project]
name = "resume2io-download"
version = "1.0.0"
description = "Download resume.io documents as PDF without a subscription"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.135.3",
    "jinja2==3.1.6",
    "pillow==12.2.0",
    "playwright>=1.44.0",
    "pypdf==6.10.0",
    "uvicorn==0.44.0",
]

[tool.ruff]
line-length = 120
lint.select = ["F", "E", "W", "I", "N"]
